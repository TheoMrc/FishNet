<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{ experiment }}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><h1>{{ experiment }}</h1><nav><a href="{{ url_for('index') }}">Experiments</a><a href="{{ url_for('rolling') }}">Rolling labels</a></nav></header><main><section class="card"><table><thead><tr><th>Video</th><th>Reviewed frames</th><th></th></tr></thead><tbody>{% for item in videos %}<tr><td>{{ item.name }}</td><td>{{ item.reviewed }} / {{ item.total }}</td><td><a class="button" href="{{ url_for('list_frames', experiment=experiment, video=item.name) }}">Frames</a> <a class="button primary" href="{{ url_for('review_video', experiment=experiment, video=item.name) }}">Review</a></td></tr>{% endfor %}</tbody></table></section></main></body></html>
