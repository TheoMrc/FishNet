<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{ video }}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><h1>{{ experiment }} / {{ video }}</h1><nav><a href="{{ url_for('list_videos', experiment=experiment) }}">Videos</a><a href="{{ url_for('review_video', experiment=experiment, video=video) }}">Review next</a></nav></header><main><section class="card"><table><thead><tr><th>Frame</th><th>Status</th><th></th></tr></thead><tbody>{% for item in frames %}<tr><td>{{ item.name }}</td><td>{{ 'Reviewed' if item.reviewed else 'Pending' }}</td><td><a class="button" href="{{ url_for('edit_frame', experiment=experiment, video=video, frame=item.name) }}">Annotate</a></td></tr>{% endfor %}</tbody></table></section></main></body></html>
